<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Charles Mithamo</title>
<style>
:root {
  --bg: #090b0a;
  --accent: #b7ff45;
  --text: #f4f5f2;
  --muted: #a5ada5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  text-align: center;
}
main { max-width: 650px; }
.logo {
  color: var(--accent);
  font-weight: bold;
  letter-spacing: 3px;
  font-size: 14px;
}
.number {
  color: var(--accent);
  font-size: clamp(110px, 30vw, 220px);
  font-weight: 900;
  line-height: 1;
  margin: 35px 0 15px;
  text-shadow: 0 0 45px rgba(183,255,69,.15);
  animation: appear .8s ease both;
}
h1 { font-size: clamp(25px, 6vw, 38px); margin: 15px 0; }
p { color: var(--muted); line-height: 1.8; }
.btn {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 25px;
  border-radius: 8px;
  background: var(--accent);
  color: #10140b;
  font-weight: bold;
  text-decoration: none;
  transition: transform .25s, box-shadow .25s;
}
.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(183,255,69,.2);
}
footer { margin-top: 55px; color: #778077; font-size: 13px; }
@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<main>
  <div class="logo">CHARLES MITHAMO</div>
  <div class="number">404</div>
  <h1>Oops! Page Not Found.</h1>
  <p>
    The page you're looking for may have been moved,
    deleted or doesn't exist.
  </p>
  <p>Don't worry. Let's get you back on track.</p>
  <a class="btn" href="/mithamo-portfolio/">← Back to Homepage</a>
  <footer>© 2026 Charles Mithamo. All rights reserved.</footer>
</main>
</body>
</html>
