<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Request a Service | Charles Mithamo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="portal-header">
  <a class="brand" href="../index.html">
    CHARLES <span>MITHAMO</span>
  </a>
  <a href="../index.html">Main Website</a>
</header>

<main class="portal-main">
  <section class="portal-card" style="max-width:520px">

    <h1>HIRE ME</h1>
    <p class="subtitle">
      Tell me about your project. No account required.
    </p>

    <form id="requestForm">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name"
          placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email"
          placeholder="Your email address" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone / WhatsApp</label>
        <input type="tel" id="phone"
          placeholder="Your phone number" required>
      </div>

      <div class="form-group">
        <label for="service">Choose a Service</label>
        <select id="service" required>
          <option value="">Select a service</option>
          <option>Logo Design</option>
          <option>Graphic Design</option>
          <option>Brand Identity</option>
          <option>Poster and Flyer Design</option>
          <option>Website Design</option>
          <option>Website Development</option>
          <option>Other Creative Service</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budget">Estimated Budget</label>
        <select id="budget" required>
          <option value="">Select your budget</option>
          <option>KSh 1,000 - 3,000</option>
          <option>KSh 3,000 - 5,000</option>
          <option>KSh 5,000 - 10,000</option>
          <option>KSh 10,000 - 20,000</option>
          <option>Above KSh 20,000</option>
          <option>Not sure yet</option>
        </select>
      </div>

      <div class="form-group">
        <label for="details">Project Description</label>
        <textarea id="details" rows="5"
          placeholder="Describe what you need..."
          required></textarea>
      </div>

      <button type="submit" class="gold-btn">
        SUBMIT PROJECT REQUEST
      </button>

    </form>

    <p id="requestMessage" class="subtitle"
       aria-live="polite"></p>

    <div class="form-links">
      <p>Already a customer?
        <a href="login.html">Client Login</a>
      </p>
    </div>

  </section>
</main>

<footer class="portal-footer">
  © 2026 Charles Mithamo. All Rights Reserved.
</footer>

<script type="module">
import { supabase } from './supabase-client.js';

const form = document.getElementById("requestForm");
const message = document.getElementById("requestMessage");
const button = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "SUBMITTING REQUEST...";

  const request = {
    customer_id: null,
    full_name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim().toLowerCase(),
    phone: document.getElementById("phone").value.trim(),
    service_type: document.getElementById("service").value,
    budget: document.getElementById("budget").value,
    description: document.getElementById("details").value.trim()
  };

  try {
    const { error } = await supabase
      .from("service_requests")
      .insert(request);

    if (error) throw error;

    message.textContent =
      "Thank you! Your project request has been submitted successfully. Charles will contact you soon.";

    form.reset();

  } catch (error) {
    message.textContent =
      "Could not submit your request: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "SUBMIT PROJECT REQUEST";
  }
});
</script>

</body>
</html>
