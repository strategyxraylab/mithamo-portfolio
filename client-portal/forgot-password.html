<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Charles Mithamo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="portal-header">
    <a class="brand" href="../index.html">CHARLES <span>MITHAMO</span></a>
    <a href="login.html">Back to Login</a>
  </header>

  <main class="portal-main">
    <section class="portal-card">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Reset Your Password</h1>
      <p>Enter your registered email address. We will use it to send a password-reset link once secure account services are connected.</p>

      <form id="resetForm">
        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button class="gold-btn" type="submit">Send Reset Link</button>
      </form>

      <p id="message" role="status"></p>
      <div class="form-links">
        <a href="login.html">Return to Login</a>
      </div>
    </section>
  </main>

  <footer class="portal-footer">© 2026 Charles Mithamo. All rights reserved.</footer>

  <script type="module">
import { supabase } from './supabase-client.js';

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim().toLowerCase();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "SENDING...";

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: "https://strategyxraylab.github.io/mithamo-portfolio/client-portal/reset-password.html"
    });

    if (error) throw error;

    message.textContent =
      "If an account exists for this email, a password-reset link will be sent. Check your inbox.";
    form.reset();

  } catch (error) {
    message.textContent = "Could not send reset email: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Send Reset Link";
  }
});
</script>
</body>
</html>
