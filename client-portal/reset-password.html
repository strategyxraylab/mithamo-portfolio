<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose New Password | Charles Mithamo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="portal-header">
    <a class="brand" href="../index.html">CHARLES <span>MITHAMO</span></a>
    <a href="login.html">Back to Login</a>
  </header>

  <main class="portal-main">
    <section class="portal-card">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Choose a New Password</h1>
      <p>Enter your new password below.</p>

      <form id="newPasswordForm">
        <label for="password">New Password</label>
        <input id="password" type="password" minlength="8"
          placeholder="At least 8 characters" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" minlength="8"
          placeholder="Enter password again" required>

        <button class="gold-btn" type="submit">SAVE NEW PASSWORD</button>
      </form>

      <p id="message" role="status"></p>
      <div class="form-links">
        <a href="login.html">Return to Login</a>
      </div>
    </section>
  </main>

  <footer class="portal-footer">© 2026 Charles Mithamo. All rights reserved.</footer>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const form = document.getElementById("newPasswordForm");
    const message = document.getElementById("message");
    const button = form.querySelector('button[type="submit"]');

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Password must contain at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "SAVING...";

      try {
        const { data: { session }, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;
        if (!session) {
          throw new Error("Your reset link may have expired. Request a new one.");
        }

        const { error } = await supabase.auth.updateUser({ password });

        if (error) throw error;

        message.textContent =
          "Password updated successfully. You can now sign in with your new password.";
        form.reset();

      } catch (error) {
        message.textContent = "Password update failed: " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "SAVE NEW PASSWORD";
      }
    });
  </script>
</body>
</html>
